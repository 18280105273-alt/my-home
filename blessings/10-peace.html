<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#e9f7f7">
    <meta name="description" content="一封愿你平安喜乐的日常祝福">
    <title>平安喜乐 · 日日是好日</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="assets/blessing.css?v=20260924-strong">
</head>
<body data-theme="peace">
    <canvas id="fx" class="fx-canvas" aria-hidden="true"></canvas>
    <div class="sky-art" aria-hidden="true"></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <section class="cover" aria-labelledby="cover-title">
        <div class="cover-inner">
            <p class="cover-kicker">Every Day · 平安喜乐</p>
            <div class="cover-emblem" aria-hidden="true"></div>
            <h1 id="cover-title" class="cover-title">日子滚烫，又暖又亮</h1>
            <p class="cover-subtitle">把平常的好天气、好心情，都送给你。</p>
            <button class="open-button" type="button">
                收下好心情
                <span class="open-button-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24"><path d="M5 12h13M13 7l5 5-5 5"/></svg>
                </span>
            </button>
            <p class="cover-hint">愿今天顺遂，明天也一样</p>
        </div>
    </section>

    <main class="site-shell">
        <section class="world">
            <article class="blessing">
                <header class="blessing-heading">
                    <p class="blessing-kicker">四季安然 · 日日有光</p>
                    <span class="recipient" data-recipient>致 认真生活的你</span>
                    <h1 class="blessing-title">平安<span class="accent">喜乐</span></h1>
                </header>
                <div class="blessing-message">
                    <span class="message-line">愿清晨有期待，夜晚有安眠。</span>
                    <span class="message-line">愿忙碌有收获，闲暇有欢喜。</span>
                    <span class="message-line">愿生活偶尔泛着光，烦恼都能被风吹散。</span>
                    <span class="message-line">愿你所求皆如愿，所盼皆有期。</span>
                </div>
                <p class="blessing-signature"><span data-sender>来自 希望你好的人</span></p>
                <div class="blessing-actions">
                    <button class="action-button" type="button" data-page-action="copy">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M15 9V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h3"/></svg>
                        复制祝福
                    </button>
                    <a class="action-button" href="index.html">
                        选择另一封
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13M13 7l5 5-5 5"/></svg>
                    </a>
                </div>
            </article>
        </section>
    </main>

    <script src="assets/blessing.js?v=20260924-strong"></script>
</body>
</html>
