<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#091426">
    <meta name="description" content="一封献给爸爸的如山祝福">
    <title>父亲节快乐 · 如山守护</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="assets/blessing.css?v=20260924-no-title">
</head>
<body data-theme="fathers-day">
    <canvas id="fx" class="fx-canvas" aria-hidden="true"></canvas>
    <div class="sky-art" aria-hidden="true"></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <section class="cover" aria-labelledby="cover-title">
        <div class="cover-inner">
            <p class="cover-kicker">For Dad · 如山守护</p>
            <div class="cover-emblem" aria-hidden="true"></div>
            <h1 id="cover-title" class="cover-title">你从不言说，却始终如山</h1>
            <p class="cover-subtitle">有些感谢不必大声，但值得认真地写下来。</p>
            <button class="open-button" type="button">
                送给爸爸
                <span class="open-button-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24"><path d="M5 12h13M13 7l5 5-5 5"/></svg>
                </span>
            </button>
            <p class="cover-hint">愿岁月放慢脚步，护他平安</p>
        </div>
    </section>

    <main class="site-shell">
        <section class="world">
            <article class="blessing">
                <header class="blessing-heading">
                    <p class="blessing-kicker">沉默有光 · 守护无声</p>
                    <span class="recipient" data-recipient>致 最可靠也最温柔的爸爸</span>
                    <h1 class="blessing-title">爸爸，<span class="accent">节日快乐</span></h1>
                </header>
                <div class="blessing-message">
                    <span class="message-line">你总把辛苦藏在身后，把安心留给我。</span>
                    <span class="message-line">你教我的勇敢，正在带我走向更远的地方。</span>
                    <span class="message-line">愿往后的日子，少一点奔波，多一点从容。</span>
                    <span class="message-line">愿你身体硬朗，笑口常开，万事顺心。</span>
                </div>
                <p class="blessing-signature"><span data-sender>来自 一直被你守护的孩子</span></p>
                <div class="blessing-actions">
                    <button class="action-button" type="button" data-page-action="copy">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M15 9V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h3"/></svg>
                        复制祝福
                    </button>
                    <a class="action-button" href="index.html">
                        选择另一封
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13M13 7l5 5-5 5"/></svg>
                    </a>
                </div>
            </article>
        </section>
    </main>

    <script src="assets/blessing.js?v=20260924-no-title"></script>
</body>
</html>
