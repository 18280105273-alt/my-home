<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1f1711">
    <meta name="description" content="一封写给相遇与陪伴的感恩祝福">
    <title>感恩有你 · 所有相遇都有意义</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="assets/blessing.css?v=20260924-no-title">
</head>
<body data-theme="thanksgiving">
    <canvas id="fx" class="fx-canvas" aria-hidden="true"></canvas>
    <div class="sky-art" aria-hidden="true"></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <section class="cover" aria-labelledby="cover-title">
        <div class="cover-inner">
            <p class="cover-kicker">Gratitude · 秋日来信</p>
            <div class="cover-emblem" aria-hidden="true"></div>
            <h1 id="cover-title" class="cover-title">所有相遇，都是礼物</h1>
            <p class="cover-subtitle">把没说出口的感谢，装进这一页秋天。</p>
            <button class="open-button" type="button">
                拆开感谢
                <span class="open-button-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24"><path d="M5 12h13M13 7l5 5-5 5"/></svg>
                </span>
            </button>
            <p class="cover-hint">谢谢你来过我的世界</p>
        </div>
    </section>

    <main class="site-shell">
        <section class="world">
            <article class="blessing">
                <header class="blessing-heading">
                    <p class="blessing-kicker">山河入秋 · 感恩常在</p>
                    <span class="recipient" data-recipient>致 一路同行的你</span>
                    <h1 class="blessing-title">感恩<span class="accent">有你</span></h1>
                </header>
                <div class="blessing-message">
                    <span class="message-line">谢谢那些不被言说的善意，照亮过平凡的日子。</span>
                    <span class="message-line">谢谢每一次真诚的陪伴，让漫长路途有了温度。</span>
                    <span class="message-line">愿所有给予，都能被岁月温柔收藏。</span>
                    <span class="message-line">愿我们都被这个世界，认真地爱着。</span>
                </div>
                <p class="blessing-signature"><span data-sender>来自 记得每一份温暖的你</span></p>
                <div class="blessing-actions">
                    <button class="action-button" type="button" data-page-action="copy">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M15 9V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h3"/></svg>
                        复制祝福
                    </button>
                    <a class="action-button" href="index.html">
                        选择另一封
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13M13 7l5 5-5 5"/></svg>
                    </a>
                </div>
            </article>
        </section>
    </main>

    <script src="assets/blessing.js?v=20260924-no-title"></script>
</body>
</html>
