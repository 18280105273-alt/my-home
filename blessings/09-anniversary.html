<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#10131d">
    <meta name="description" content="一封写给相爱时光的周年祝福">
    <title>周年快乐 · 时光与你</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="assets/blessing.css">
</head>
<body data-theme="anniversary">
    <canvas id="fx" class="fx-canvas" aria-hidden="true"></canvas>
    <div class="sky-art" aria-hidden="true"></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <section class="cover" aria-labelledby="cover-title">
        <div class="cover-inner">
            <p class="cover-kicker">Anniversary · 时光纪念</p>
            <div class="cover-emblem" aria-hidden="true"></div>
            <h1 id="cover-title" class="cover-title">时光流转，我们仍在彼此身边</h1>
            <p class="cover-subtitle">把走过的日子，轻轻放进这一枚时间环里。</p>
            <button class="open-button" type="button">
                纪念此刻
                <span class="open-button-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24"><path d="M5 12h13M13 7l5 5-5 5"/></svg>
                </span>
            </button>
            <p class="cover-hint">愿还有很多个一起庆祝的明天</p>
        </div>
    </section>

    <main class="site-shell">
        <section class="world">
            <article class="blessing">
                <header class="blessing-heading">
                    <p class="blessing-kicker">岁月为证 · 爱意长青</p>
                    <span class="recipient" data-recipient>致 和我并肩走过时光的你</span>
                    <h1 class="blessing-title">周年<span class="accent">快乐</span></h1>
                </header>
                <div class="blessing-message">
                    <span class="message-line">谢谢你，把平凡的日子过成了共同的故事。</span>
                    <span class="message-line">那些并肩看过的风景，都成了最好的纪念。</span>
                    <span class="message-line">往后的每一年，愿我们仍能牵手走过四季，</span>
                    <span class="message-line">把喜欢写长，把陪伴写久，把未来写进彼此。</span>
                </div>
                <p class="blessing-signature"><span data-sender>来自 想和你走很久的人</span></p>
                <div class="blessing-actions">
                    <button class="action-button" type="button" data-page-action="copy">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M15 9V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h3"/></svg>
                        复制祝福
                    </button>
                    <a class="action-button" href="index.html">
                        选择另一封
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13M13 7l5 5-5 5"/></svg>
                    </a>
                </div>
            </article>
        </section>
    </main>

    <script src="assets/blessing.js"></script>
</body>
</html>
