<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#08121b">
    <meta name="description" content="一封奔向未来的毕业祝福">
    <title>毕业快乐 · 来日方长</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="assets/blessing.css?v=20260924-strong">
</head>
<body data-theme="graduation">
    <canvas id="fx" class="fx-canvas" aria-hidden="true"></canvas>
    <div class="sky-art" aria-hidden="true"></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <section class="cover" aria-labelledby="cover-title">
        <div class="cover-inner">
            <p class="cover-kicker">Graduation · 下一站，远方</p>
            <div class="cover-emblem" aria-hidden="true"></div>
            <h1 id="cover-title" class="cover-title">山高路远，我们来日方长</h1>
            <p class="cover-subtitle">把这一程的勇敢收好，下一程继续发光。</p>
            <button class="open-button" type="button">
                毕业启程
                <span class="open-button-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24"><path d="M5 12h13M13 7l5 5-5 5"/></svg>
                </span>
            </button>
            <p class="cover-hint">愿每次出发，都通向更辽阔的世界</p>
        </div>
    </section>

    <main class="site-shell">
        <section class="world">
            <article class="blessing">
                <header class="blessing-heading">
                    <p class="blessing-kicker">青春落款 · 未来开篇</p>
                    <span class="recipient" data-recipient>致 即将奔赴山海的你</span>
                    <h1 class="blessing-title">毕业<span class="accent">快乐</span></h1>
                </header>
                <div class="blessing-message">
                    <span class="message-line">愿你带着少年意气，也带着从容坚定。</span>
                    <span class="message-line">愿此去繁花似锦，再相见依旧如故。</span>
                    <span class="message-line">无论选择哪条路，都请你相信自己的脚步。</span>
                    <span class="message-line">下一站，愿你有梦可追，有光可循。</span>
                </div>
                <p class="blessing-signature"><span data-sender>来自 为你喝彩的同行者</span></p>
                <div class="blessing-actions">
                    <button class="action-button" type="button" data-page-action="copy">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M15 9V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h3"/></svg>
                        复制祝福
                    </button>
                    <a class="action-button" href="index.html">
                        选择另一封
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13M13 7l5 5-5 5"/></svg>
                    </a>
                </div>
            </article>
        </section>
    </main>

    <script src="assets/blessing.js?v=20260924-strong"></script>
</body>
</html>
