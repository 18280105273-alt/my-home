<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#211739">
    <meta name="description" content="一份为你亮灯的生日祝福">
    <title>生日快乐 · 今天为你亮灯</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="assets/blessing.css?v=20260924-strong">
</head>
<body data-theme="birthday">
    <canvas id="fx" class="fx-canvas" aria-hidden="true"></canvas>
    <div class="sky-art" aria-hidden="true"></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <section class="cover" aria-labelledby="cover-title">
        <div class="cover-inner">
            <p class="cover-kicker">Happy Birthday · 独家庆生</p>
            <div class="cover-emblem" aria-hidden="true"></div>
            <h1 id="cover-title" class="cover-title">今天，世界为你亮灯</h1>
            <p class="cover-subtitle">蜡烛已经点燃，这一页只写给你。</p>
            <button class="open-button" type="button">
                打开礼物
                <span class="open-button-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24"><path d="M5 12h13M13 7l5 5-5 5"/></svg>
                </span>
            </button>
            <p class="cover-hint">许愿吧，今天所有美好都偏爱你</p>
        </div>
    </section>

    <main class="site-shell">
        <section class="world">
            <article class="blessing">
                <header class="blessing-heading">
                    <p class="blessing-kicker">岁岁欢愉 · 年年胜意</p>
                    <span class="recipient" data-recipient>致 今天最闪亮的主角</span>
                    <h1 class="blessing-title">生日<span class="accent">快乐</span></h1>
                </header>
                <div class="blessing-message">
                    <span class="message-line">愿你的快乐不需要理由，</span>
                    <span class="message-line">愿你的努力都有回音。</span>
                    <span class="message-line">新的一岁，继续自由、热烈、闪闪发光。</span>
                    <span class="message-line">想去的地方都能抵达，想爱的人都在身旁。</span>
                </div>
                <p class="blessing-signature"><span data-sender>来自 永远为你鼓掌的人</span></p>
                <div class="blessing-actions">
                    <button class="action-button" type="button" data-page-action="copy">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M15 9V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h3"/></svg>
                        复制祝福
                    </button>
                    <a class="action-button" href="index.html">
                        选择另一封
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13M13 7l5 5-5 5"/></svg>
                    </a>
                </div>
            </article>
        </section>
    </main>

    <script src="assets/blessing.js?v=20260924-strong"></script>
</body>
</html>
